{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapor {{ student.nama }}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261124c">
  <link rel="stylesheet" href="{% static 'css/rapor.css' %}?v=20261124c">
  <style>@page { size: {{ school.lebar_kertas_mm }}mm {{ school.tinggi_kertas_mm }}mm; margin: 12mm 14mm; }</style>
</head>
<body class="rapor-page">
  <div class="rapor-toolbar no-print">
    <a class="btn" href="{% url 'akademik:rapor_index' %}"><svg class="icon"><use href="#i-back"/></svg> Kembali</a>
    <div style="display:flex;gap:8px;align-items:center">
      {% if report_card %}<span class="badge {% if report_card.status == 'PUBLISHED' %}badge-green{% else %}badge-gray{% endif %}">{{ report_card.get_status_display }}</span>{% endif %}
      <a class="btn" href="{% url 'akademik:rapor_pdf' student.id %}"><svg class="icon"><use href="#i-file"/></svg> PDF</a>
      <a class="btn" href="{% url 'akademik:rapor_sampul' student.id %}"><svg class="icon"><use href="#i-file"/></svg> Sampul</a>
      <button type="button" class="btn btn-gold" onclick="window.print()"><svg class="icon"><use href="#i-printer"/></svg> Cetak Rapor</button>
    </div>
  </div>

  {% include 'akademik/_rapor_sheet.html' %}
</body>
</html>
