{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cetak Semua Rapor</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/rapor.css' %}">
  <style>@page { size: {{ school.lebar_kertas_mm }}mm {{ school.tinggi_kertas_mm }}mm; margin: 12mm 14mm; }</style>
</head>
<body class="rapor-page">
  <div class="rapor-toolbar no-print">
    <a class="btn" href="{% url 'akademik:rapor_index' %}"><svg class="icon"><use href="#i-back"/></svg> Kembali</a>
    <button type="button" class="btn btn-gold" onclick="window.print()"><svg class="icon"><use href="#i-printer"/></svg> Cetak Semua ({{ data|length }} siswa)</button>
  </div>

  {% for item in data %}
    {% include 'akademik/_rapor_sheet.html' with student=item.student semester=item.semester mapel_rows=item.mapel_rows ekskul_rows=item.ekskul_rows catatan=item.catatan school=item.school page_break=1 %}
  {% endfor %}
</body>
</html>
